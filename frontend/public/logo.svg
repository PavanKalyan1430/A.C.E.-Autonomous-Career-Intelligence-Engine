<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="100%" height="100%">
  <defs>
    <!-- Primary Emerald Metallic Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2B1B"/>
      <stop offset="35%" stop-color="#144C30"/>
      <stop offset="70%" stop-color="#1F6F47"/>
      <stop offset="100%" stop-color="#2D9A63"/>
    </linearGradient>

    <!-- Accent Highlight Gradient -->
    <linearGradient id="emeraldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#46D88E"/>
      <stop offset="100%" stop-color="#1B603D"/>
    </linearGradient>

    <!-- Subtle Inner Shadow / Glow Filter -->
    <filter id="shadowDepth" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadowDepth)">
    <!-- ==================== SPADE EMBLEM ==================== -->
    <g transform="translate(10, 10)">
      <!-- Outer Spade Shell with Base -->
      <path d="M 85,15 
               C 85,15 115,55 135,78 
               C 152,98 155,122 135,138 
               C 118,152 92,142 85,122 
               C 78,142 52,152 35,138 
               C 15,122 18,98 35,78 
               C 55,55 85,15 85,15 Z" 
            fill="url(#emeraldGrad)" 
            stroke="#13442B" 
            stroke-width="2"/>
      
      <!-- Spade Base Pedestal -->
      <path d="M 50,146 L 120,146 L 112,160 L 58,160 Z" 
            fill="url(#emeraldGrad)" 
            stroke="#13442B" 
            stroke-width="1.5"/>

      <!-- Inner Spade Outline Cutout (White/Transparent gap) -->
      <path d="M 85,32 
               C 85,32 108,65 124,84 
               C 137,100 139,118 124,130 
               C 111,141 93,132 85,114 
               C 77,132 59,141 46,130 
               C 31,118 33,100 46,84 
               C 62,65 85,32 85,32 Z" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Inner Core Flame Spade -->
      <path d="M 85,48 
               C 85,48 102,74 114,90 
               C 123,102 124,114 113,123 
               C 103,130 90,123 85,110 
               C 80,123 67,130 57,123 
               C 46,114 47,102 56,90 
               C 68,74 85,48 85,48 Z" 
            fill="url(#emeraldGrad)"/>

      <!-- Flame Swirl Accent inside Spade Core -->
      <path d="M 85,108 C 80,95 72,90 68,80 C 78,82 82,92 85,108 Z" fill="#46D88E" opacity="0.85"/>
      <path d="M 85,108 C 90,95 98,90 102,80 C 92,82 88,92 85,108 Z" fill="#46D88E" opacity="0.85"/>
    </g>

    <!-- ==================== LETTER C ==================== -->
    <g transform="translate(180, 20)">
      <!-- Outer C Loop -->
      <path d="M 105,25 
               C 60,10 15,35 15,85 
               C 15,135 60,160 105,145 
               C 80,138 45,118 45,85 
               C 45,52 80,32 105,25 Z" 
            fill="url(#emeraldGrad)"/>
      
      <!-- C Top Slice Cutout -->
      <path d="M 65,22 L 95,8 L 102,30 L 72,42 Z" fill="#FFFFFF"/>
      
      <!-- C Middle Swoosh Cutout -->
      <path d="M 22,88 C 45,80 85,75 115,75 L 115,95 C 80,95 45,98 22,108 Z" fill="#FFFFFF"/>
    </g>

    <!-- ==================== LETTER E ==================== -->
    <g transform="translate(305, 20)">
      <!-- Main E Backbone and Arms -->
      <path d="M 25,20 L 115,20 L 115,46 L 55,46 L 55,70 L 105,70 L 105,96 L 55,96 L 55,124 L 118,124 L 118,150 L 25,150 Z" 
            fill="url(#emeraldGrad)"/>

      <!-- E Top Diagonal Cutout -->
      <path d="M 45,20 L 75,5 L 85,28 L 55,42 Z" fill="#FFFFFF"/>

      <!-- Extended Connecting Flow Ribbon (Merging from C to E) -->
      <path d="M -25,95 C 10,85 45,75 85,85 C 105,90 125,105 145,120 L 130,138 C 110,122 92,108 75,104 C 40,96 10,102 -25,115 Z" 
            fill="url(#emeraldGrad)"/>
      
      <!-- White accent stripe on ribbon -->
      <path d="M -20,102 C 15,92 48,85 80,92 C 100,97 118,110 135,125" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="3" 
            stroke-linecap="round"/>
    </g>
  </g>
</svg>
